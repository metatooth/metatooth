- hosts: servers

  tasks:
    - name: Ensure {{ build_dir }} dir exists
      ansible.builtin.file:
        path: "{{ build_dir }}"
        state: directory

    - name: Copy database dump
      become: yes
      synchronize:
        src: "{{ db_dump_path }}"
        dest: "{{ build_dir }}/magento-final.sql"
        rsync_opts:
          - "--chmod=Fu=rw,Fgo="

    - name: Check whether {{ site_domain }} service unit exists
      become: yes
      ansible.builtin.stat:
        path: /etc/systemd/system/com.{{ site_slug }}.service
      register: magento_service_unit

    - name: Check whether {{ site_domain }} service is running
      become: yes
      ansible.builtin.shell:
        cmd: systemctl is-active --quiet com.{{ site_slug }}
      register: magento_service_status
      changed_when: false
      failed_when: false

    - name: Restore database safely
      block:
        - name: Stop {{ site_domain }} service during restore
          become: yes
          ansible.builtin.systemd:
            name: com.{{ site_slug }}
            state: stopped
          when:
            - magento_service_unit.stat.exists
            - magento_service_status.rc == 0

        - name: Import database dump
          become: yes
          ansible.builtin.shell:
            cmd: |
              set -o pipefail
              grep -v "^CREATE DATABASE\|^USE " {{ build_dir }}/magento-final.sql | \
                sed "s/ DEFINER=\`[^\`]*\`@\`[^\`]*\`//" | \
                mysql -h {{ db_host }} -P {{ db_port | default('3306') }} \
                  -u {{ db_user }} {{ db_name }}
            executable: /bin/bash
          environment:
            MYSQL_PWD: "{{ db_password }}"
          register: magento_restore_db
          changed_when: magento_restore_db.rc == 0
          failed_when: magento_restore_db.rc != 0
      always:
        - name: Remove database dump from server
          become: yes
          ansible.builtin.file:
            path: "{{ build_dir }}/magento-final.sql"
            state: absent

        - name: Start {{ site_domain }} service after restore
          become: yes
          ansible.builtin.systemd:
            name: com.{{ site_slug }}
            state: started
          when: magento_service_unit.stat.exists
