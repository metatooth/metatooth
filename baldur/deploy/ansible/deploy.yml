- hosts: servers

  vars:
    # laramirandagoodman.com -> com.laramirandagoodman
    service_name: "{{ site_domain.split('.') | reverse | join('.') }}"

  tasks:
    - name: Sync docker image
      synchronize:
        src: "{{ src_dir }}/baldur_app_latest.tar.gz"
        dest: "{{ deploy_dir }}"

    - name: Load docker image
      ansible.builtin.shell:
        cmd: docker load < baldur_app_latest.tar.gz
        chdir: "{{ deploy_dir }}"

    - name: Install .env file
      template:
        src: ./templates/dotenv.j2
        dest: "{{ deploy_dir }}/.env"
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0600'

    - name: Stop running container
      ansible.builtin.shell:
        cmd: docker container remove --force {{ container_name }}

    - name: Run docker image as container
      ansible.builtin.shell:
        cmd: >
          docker run -d
          --restart unless-stopped
          -p {{ baldur_port }}:4567
          --name {{ container_name }}
          --add-host={{ db_host }}:{{ db_host_ip }}
          --env-file {{ deploy_dir }}/.env
          baldur_app:latest

    - name: Install {{ site_domain }} service
      become: yes
      template:
        src: ./templates/systemd-service.j2
        dest: /etc/systemd/system/{{ service_name }}.service
        owner: root
        group: root
        mode: '0644'

    - name: Enable and start {{ site_domain }} service
      become: yes
      systemd:
        name: "{{ service_name }}"
        state: restarted
        daemon_reload: yes
        enabled: yes

- hosts: balancers

  vars:
    # laramirandagoodman.com -> laramirandagoodman-com
    site_conf: "{{ site_domain | replace('.', '-') }}"

  handlers:
    - name: Restart Nginx
      become: yes
      ansible.builtin.service:
        name: nginx
        state: restarted

  tasks:

  - name: Install {{ site_domain }} config
    become: yes
    template:
      src: ./templates/site-nginx.j2
      dest: /etc/nginx/sites-available/{{ site_conf }}

  - name: Enable {{ site_domain }}
    become: yes
    file:
      src: /etc/nginx/sites-available/{{ site_conf }}
      dest: /etc/nginx/sites-enabled/{{ site_conf }}
      state: link
    notify: Restart Nginx
