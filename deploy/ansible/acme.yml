# Shared tasks for issuing and renewing one TLS certificate on a balancer with
# acme.sh. Included by each project's certs.yml, which runs them against the
# balancers group and supplies:
#
#   cert_domain   primary domain
#   cert_aliases  extra names on the same certificate (list)
#   acme_script   path to deploy/scripts/issue-cert.sh on the controller
#   acme_email    from the inventory
#   acme_ca       optional, defaults to zerossl
#
# Run before the first site deploy: nginx will not reload while a site config
# references a certificate that does not exist yet. A catch-all port 80 server
# answers the challenge for hosts that have no site config yet; afterwards the
# site's own port 80 server does.
- name: Require site_domain and acme_email
  assert:
    that:
      - site_domain is defined
      - acme_email is defined
    fail_msg: Set site_domain and acme_email in the inventory.

- name: Ensure curl is installed
  become: yes
  apt:
    name: curl
    state: present
    cache_valid_time: 86400

- name: Ensure ACME webroot exists
  become: yes
  file:
    path: "{{ acme_webroot }}"
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Install catch-all ACME challenge server
  become: yes
  block:
    - name: Write acme-challenge.conf
      copy:
        dest: /etc/nginx/conf.d/acme-challenge.conf
        owner: root
        group: root
        mode: '0644'
        content: |
          server {
            listen 80 default_server;
            server_name _;

            location /.well-known/acme-challenge/ {
              root {{ acme_webroot }};
            }

            location / {
              return 404;
            }
          }

    - name: Validate nginx config
      command: nginx -t
      changed_when: false

    - name: Reload nginx
      service:
        name: nginx
        state: reloaded
  rescue:
    - name: Remove acme-challenge.conf
      file:
        path: /etc/nginx/conf.d/acme-challenge.conf
        state: absent

    - name: Fail
      fail:
        msg: >
          nginx -t failed with the catch-all ACME server (another
          default_server on port 80, or a site referencing a missing
          certificate?). Removed it; fix the config and re-run.

- name: Issue or renew {{ cert_domain }}
  become: yes
  script: >
    {{ acme_script | quote }}
    {{ acme_email | quote }} {{ acme_ca | quote }} {{ acme_webroot | quote }}
    {{ cert_domain | quote }}
    {% for alias in cert_aliases %}{{ alias | quote }} {% endfor %}
  register: issue
  changed_when: "'Cert success' in issue.stdout or 'Installing cert' in issue.stdout"
