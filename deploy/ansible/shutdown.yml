#
# shutdown.yml
#
# Shutsdown all hosts
#
---
- hosts: all
  tasks:
    - name: Shutdown # Shutdown debian based hosts (including raspbian, ubuntu etc).
      shell: nohup bash -c "/bin/sleep 5 && /sbin/shutdown -h now" &
      when: ansible_facts["os_family"] == "Debian"
      become: true

    - name: Shutdown # Shutdown all redhat hosts (including centos).
      shell: nohup bash -c "/usr/bin/sleep 5 && /usr/sbin/shutdown -h now" &
      when: ansible_facts["os_family"] == "RedHat"
      become: true
